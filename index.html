* {

}
html, body {

  padding: 0;

  background: #0B1420;
  color: #EDF1F7;
  font-family: 'Inter', sans-serif;

body {

button, input, select {

button {

}
.font-mono {

#app {

}
/* HEADER */
.header {
  position: relative;
  overflow: hidden;
  padding: 32px 20px 20px;

}
.header-kicker {

  font-size: 40px;
  line-height: 0.95;
  font-weight: 400;
}
.header-meta {
  display: flex;
  gap: 12px;
  margin-top: 12px;
  color: #7C93B5;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
/* MAIN */
.main {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 16px;
}
.section {
  margin-bottom: 16px;
}
/* TABS */
.tab-bar {
  position: fixed;
  z-index: 100;
  bottom: 0;
  left: 0;
  right: 0;
  background: #101B2C;

}
.tab-inner {

  margin: 0 auto;

}
.tab-button {

  border: 0;
  background: transparent;
  color: #7C93B5;
  padding: 11px 4px 10px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.tab-button.active {
  color: #E8384F;
}
.tab-icon {
  display: block;
  font-size: 20px;
  margin-bottom: 3px;
}
/* CARDS */
.card {

  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
}
.card-padding {
  padding: 12px;
}
/* WEEK SELECT / FILTERS */
.filter-card {
  padding: 12px;
  margin-bottom: 12px;
}
.filter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.filter-label {

.filter-select {

  padding: 9px 10px;
  font-size: 12px;
  outline: none;
}
.filter-select:focus {

}
/* LEAGUE TABLE */
.table-header {
  display: flex;
  justify-content: space-between;
  padding: 0 8px;
  margin-bottom: 5px;
  color: #7C93B5;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
}
.table-header-right {

  gap: 16px;

}
.team-row {
  overflow: hidden;
  margin-bottom: 8px;
  position: relative;
}
.team-row.qualifying::before {
  content: "";

  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: #3EBD7D;
}
.team-main {
  width: 100%;
  border: 0;
  background: transparent;
  color: #EDF1F7;

  align-items: center;
  gap: 10px;
  padding: 12px;

}
.rank {
  width: 28px;
  height: 28px;
  min-width: 28px;
  border-radius: 50%;

  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
}
.team-info {
  flex: 1;
  min-width: 0;
}
.team-name {

  font-weight: 600;

.team-record {

.points {

.chevron {
  color: #7C93B5;

}
.chevron.open {

}
.team-stats {

.stat-cell {

const ROOT = "padel";
/* ============================================================
   FIREBASE FUNCTIONS
   ============================================================ */
async function firebaseGet(path, fallback) {
  try {
    const response = await fetch(
      FIREBASE_URL + "/" + ROOT + "/" + path + ".json"
    );
    if (!response.ok) {
      throw new Error("Firebase HTTP " + response.status);
    }
    const data = await response.json();
    if (data === null || data === undefined) {
      return fallback;
    }
    return data;
  } catch (error) {
    console.error("Firebase GET error:", error);
    throw error;
  }
}
async function firebaseSet(path, value) {
  try {
    const response = await fetch(
      FIREBASE_URL + "/" + ROOT + "/" + path + ".json",
      {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(value)
      }
    );
    if (!response.ok) {
      throw new Error("Firebase HTTP " + response.status);
    }
    return true;
  } catch (error) {
    console.error("Firebase SET error:", error);
    throw error;
  }
}

  return String(value)

    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")

}

/* ============================================================
   SCORING
   ============================================================ */
function pointsForResult(scoreA, scoreB) {
  if (scoreA === scoreB) {
    return {
      aPts: 0,
      bPts: 0
    };
  }
  const aWins = scoreA > scoreB;
  const loserScore = aWins ? scoreB : scoreA;
  const loserPts =
    (loserScore === 4 || loserScore === 5) ? 1 : 0;
  return aWins
    ? { aPts: 3, bPts: loserPts }
    : { aPts: loserPts, bPts: 3 };
}

/* ============================================================
   STANDINGS
   ============================================================ */
function computeStandings() {
  const stats = {};
  TEAMS.forEach(function(team) {
    stats[team.id] = {
      id: team.id,
      name: team.name,
      played: 0,
      wins: 0,
      losses: 0,
      gf: 0,
      ga: 0,
      points: 0,
      headToHead: {}
    };
  });
  SCHEDULE.forEach(function(fixture) {
    const result = results[fixture.id];
    if (!result) return;
    const [scoreA, scoreB] = result;
    const {
      aPts,
      bPts
    } = pointsForResult(scoreA, scoreB);
    const a = stats[fixture.teamA];
    const b = stats[fixture.teamB];
    if (!a || !b) return;
    a.played++;
    b.played++;
    a.gf += scoreA;
    a.ga += scoreB;
    b.gf += scoreB;
    b.ga += scoreA;
    a.points += aPts;
    b.points += bPts;
    if (scoreA > scoreB) {
      a.wins++;
      b.losses++;
    } else if (scoreB > scoreA) {
      b.wins++;
      a.losses++;
    }
    if (!a.headToHead[fixture.teamB]) {
      a.headToHead[fixture.teamB] = {
        gf: 0,
        ga: 0
      };
    }
    a.headToHead[fixture.teamB].gf += scoreA;
    a.headToHead[fixture.teamB].ga += scoreB;
    if (!b.headToHead[fixture.teamA]) {
      b.headToHead[fixture.teamA] = {
        gf: 0,
        ga: 0
      };
    }
    b.headToHead[fixture.teamA].gf += scoreB;
    b.headToHead[fixture.teamA].ga += scoreA;
  });
  return Object.values(stats).map(function(team) {
    return {
      ...team,
      gd: team.gf - team.ga
    };
  });
}
function compareTeams(a, b) {
  if (a.points !== b.points) {
    return b.points - a.points;
  }
  const h2h = a.headToHead[b.id];
  if (h2h) {
    const diff = h2h.gf - h2h.ga;
    if (diff !== 0) {
      return -diff;
    }
  }
  if (a.gf !== b.gf) {
    return b.gf - a.gf;
  }
  if (a.ga !== b.ga) {
    return a.ga - b.ga;
  }
  if (a.gd !== b.gd) {
    return b.gd - a.gd;
  }
  return a.name.localeCompare(b.name);
}
function getSortedStandings() {
  return computeStandings().sort(compareTeams);
}

function attachEvents() {
  /* TABS */
  document
    .querySelectorAll('[data-action="tab"]')
    .forEach(function(button) {
      button.addEventListener("click", function() {
        currentTab =
          button.dataset.tab;
        render();
      });
    });
  /* TABLE EXPANSION */
  document
    .querySelectorAll('[data-action="expand"]')
    .forEach(function(button) {
      button.addEventListener("click", function() {
        expandedTeam =
          expandedTeam === button.dataset.id
            ? null
            : button.dataset.id;
        render();
      });
    });
  /* UNLOCK */
  const unlock =
    document.querySelector('[data-action="unlock"]');
  if (unlock) {
    unlock.addEventListener(
      "click",
      handleUnlock
    );
  }
  /* LOCK */
  const lock =
    document.querySelector('[data-action="lock"]');
  if (lock) {
    lock.addEventListener("click", function() {
      unlocked = false;
      render();
    });
  }
  /* MANAGE WEEK */
  const manageWeekSelect =
    document.getElementById("manage-week");
  if (manageWeekSelect) {
    manageWeekSelect.addEventListener(
      "change",
      function() {
        manageWeek =
          Number(manageWeekSelect.value);
        scoreInputs = {};
        render();
      }
    );
  }
  /* SCORE INPUTS */
  document
    .querySelectorAll('[data-action="score-input"]')
    .forEach(function(input) {
      input.addEventListener("input", function() {
        const fixtureId =
          input.dataset.fixture;
        const side =
          input.dataset.side;
        if (!scoreInputs[fixtureId]) {
          const existing =
            results[fixtureId] || ["", ""];
          scoreInputs[fixtureId] = [
            existing[0],
            existing[1]
          ];
        }
        scoreInputs[fixtureId][
          side === "a" ? 0 : 1
        ] = input.value;
      });
    });
  /* FIXTURE FIELDS */
  document
    .querySelectorAll('[data-action="fixture-field"]')
    .forEach(function(input) {
      input.addEventListener("change", function() {
        const fixtureId =
          input.dataset.fixture;
        const field =
          input.dataset.field;
        const fixture =
          SCHEDULE.find(
            f => f.id === fixtureId
          );
        if (!fixture) return;
        if (field === "court") {
          fixture.court =
            Number(input.value);
        } else {
          fixture[field] =
            input.value;
        }
      });
    });
  /* SAVE FIXTURES */
  const saveFixtures =
    document.querySelector(
      '[data-action="save-fixtures"]'
    );
  if (saveFixtures) {
    saveFixtures.addEventListener(
      "click",
      saveWeekFixtures
    );
  }
  /* RESET INDIVIDUAL FIXTURE */
  document
    .querySelectorAll('[data-action="reset-fixture"]')
    .forEach(function(button) {
      button.addEventListener(
        "click",
        function() {
          const fixtureId =
            button.dataset.fixture;
          const original =
            DEFAULT_SCHEDULE.find(
              f => f.id === fixtureId
            );
          const fixture =
            SCHEDULE.find(
              f => f.id === fixtureId
            );
          if (!original || !fixture) {
            return;
          }
          Object.assign(
            fixture,
            original
          );
          render();
        }
      );
    });
  /* CLEAR RESULT */
  document
    .querySelectorAll('[data-action="clear-fixture-result"]')
    .forEach(function(button) {
      button.addEventListener(
        "click",
        function() {
          const fixtureId =
            button.dataset.fixture;
          if (
            !confirm(
              "Clear the result for this fixture?"
            )
          ) {
            return;
          }
          delete results[fixtureId];
          delete scoreInputs[fixtureId];
          saveResultsOnly();
        }
      );
    });
  /* RESET WEEK */
  const resetWeekFixtures =
    document.querySelector(
      '[data-action="reset-week-fixtures"]'
    );
  if (resetWeekFixtures) {
    resetWeekFixtures.addEventListener(
      "click",
      function() {
        if (
          !confirm(
            "Reset Week " +
            manageWeek +
            " back to the original fixtures?"
          )
        ) {
          return;
        }
        SCHEDULE =
          SCHEDULE.map(function(fixture) {
            if (
              fixture.week !== manageWeek
            ) {
              return fixture;
            }
            const original =
              DEFAULT_SCHEDULE.find(
                f => f.id === fixture.id
              );
            return original
              ? { ...original }
              : fixture;
          });
        render();
      }
    );
  }
  /* RESET ALL */
  const resetAllFixtures =
    document.querySelector(
      '[data-action="reset-all-fixtures"]'
    );
  if (resetAllFixtures) {
    resetAllFixtures.addEventListener(
      "click",
      function() {
        if (
          !confirm(
            "Reset ALL fixtures back to the original schedule?"
          )
        ) {
          return;
        }
        SCHEDULE =
          DEFAULT_SCHEDULE.map(
            f => ({ ...f })
          );
        render();
      }
    );
  }
  /* SAVE RESULTS */
  const saveWeek =
    document.querySelector(
      '[data-action="save-week"]'
    );
  if (saveWeek) {
    saveWeek.addEventListener(
      "click",
      saveWeekResults
    );
  }
}
/* ============================================================
   PASSCODE HANDLING
   ============================================================ */
async function handleUnlock() {
  const input =
    document.getElementById(
      "passcode-input"
    );
  const error =
    document.getElementById(
      "passcode-error"
    );
  const value =
    input
      ? input.value
      : "";
  /* FIRST-TIME SETUP */
  if (!passcode) {
    const confirmInput =
      document.getElementById(
        "passcode-confirm"
      );
    if (
      !value ||
      value.length < 4
    ) {
      error.textContent =
        "Use at least 4 characters.";
      return;
    }
    if (
      !confirmInput ||
      value !== confirmInput.value
    ) {
      error.textContent =
        "Passcodes don't match.";
      return;
    }
    try {
      await firebaseSet(
        "passcode",
        value
      );
      passcode = value;
      unlocked = true;
      render();
    } catch (e) {
      error.textContent =
        "Couldn't save passcode: " +
        e.message;
    }
    return;
  }
  /* EXISTING PASSCODE */
  if (value === passcode) {
    unlocked = true;
    render();
  } else {
    error.textContent =
      "Wrong passcode.";
  }
}
/* ============================================================
   SAVE FIXTURES
   ============================================================ */
async function saveWeekFixtures() {
  const error =
    document.getElementById(
      "manage-error"
    );
  const weekFixtures =
    SCHEDULE.filter(
      f => f.week === manageWeek
    );
  /* VALIDATION */
  for (
    const fixture of weekFixtures
  ) {
    if (
      !fixture.teamA ||
      !fixture.teamB
    ) {
      error.textContent =
        "Every fixture must have two teams.";
      return;
    }
    if (
      fixture.teamA ===
      fixture.teamB
    ) {
      error.textContent =
        "A team cannot play itself.";
      return;
    }
    if (
      !fixture.court ||
      fixture.court < 1
    ) {
      error.textContent =
        "Every fixture needs a valid court.";
      return;
    }
    if (
      !fixture.time ||
      !fixture.time.trim()
    ) {
      error.textContent =
        "Every fixture needs a time.";
      return;
    }
  }
  try {
    await firebaseSet(
      "fixtures",
      SCHEDULE
    );
    alert(
      "Week " +
      manageWeek +
      " fixtures saved!"
    );
    render();
  } catch (e) {
    console.error(
      "Fixture save error:",
      e
    );
    error.textContent =
      "Couldn't save fixtures: " +
      e.message;
  }
}
/* ============================================================
   SAVE RESULTS ONLY
   ============================================================ */
async function saveResultsOnly() {
  try {
    await firebaseSet(
      "results",
      results
    );
    render();
  } catch (e) {
    console.error(
      "Result save error:",
      e
    );
    alert(
      "Couldn't save result changes: " +
      e.message
    );
  }
}
/* ============================================================
   SAVE RESULTS
   ============================================================ */
async function saveWeekResults() {
  const error =
    document.getElementById(
      "manage-error"
    );
  const weekFixtures =
    SCHEDULE.filter(
      f => f.week === manageWeek
    );
  const updated =
    { ...results };
  for (
    const fixture of weekFixtures
  ) {
    const edited =
      scoreInputs[fixture.id];
    const existing =
      results[fixture.id];
    const scoreA =
      edited
        ? edited[0]
        : (existing
            ? existing[0]
            : "");
    const scoreB =
      edited
        ? edited[1]
        : (existing
            ? existing[1]
            : "");
    if (
      scoreA === "" &&
      scoreB === ""
    ) {
      continue;
    }
    if (
      scoreA === "" ||
      scoreB === ""
    ) {
      error.textContent =
        "Enter both scores for Court " +
        fixture.court +
        ", or leave both blank.";
      return;
    }
    const numberA =
      Number(scoreA);
    const numberB =
      Number(scoreB);
    if (
      !Number.isFinite(numberA) ||
      !Number.isFinite(numberB) ||
      numberA < 0 ||
      numberB < 0
    ) {
      error.textContent =
        "Scores must be valid numbers.";
      return;
    }
    if (
      numberA === numberB
    ) {
      error.textContent =
        "Scores cannot be tied.";
      return;
    }
    updated[fixture.id] = [
      numberA,
      numberB
    ];
  }
  try {
    await firebaseSet(
      "results",
      updated
    );
    results = updated;
    scoreInputs = {};
    alert(
      "Week " +
      manageWeek +
      " results saved!"
    );
    render();
  } catch (e) {
    error.textContent =
      "Couldn't save results: " +
      e.message;
  }
}
/* ============================================================
   START APP
   ============================================================ */
async function startApp() {
  const app =
    document.getElementById(
      "app"
    );
  try {
    console.log(
      "Padel: starting application"
    );
    if (
      !FIREBASE_URL ||
      FIREBASE_URL.includes("PASTE")
    ) {
      throw new Error(
        "Firebase URL is not configured."
      );
    }
    const [
      storedResults,
      storedPasscode,
      storedFixtures
    ] = await Promise.all([
      firebaseGet(
        "results",
        null
      ),
      firebaseGet(
        "passcode",
        null
      ),
      firebaseGet(
        "fixtures",
        null
      )
    ]);
    /* FIXTURES */
    if (
      storedFixtures === null
    ) {
      SCHEDULE =
        DEFAULT_SCHEDULE.map(
          f => ({ ...f })
        );
      await firebaseSet(
        "fixtures",
        SCHEDULE
      );
    } else {
      SCHEDULE =
        storedFixtures;
    }
    /* RESULTS */
    if (
      storedResults === null
    ) {
      results =
        { ...SEED_RESULTS };
      await firebaseSet(
        "results",
        results
      );
    } else {
      results =
        storedResults;
    }
    /* PASSCODE */
    passcode =
      storedPasscode || null;
    console.log(
      "Padel: Firebase loaded",
      {
        resultsCount:
          Object.keys(results).length,
        fixtureCount:
          SCHEDULE.length,
        hasPasscode:
          !!passcode
      }
    );
    render();
  } catch (error) {
    console.error(
      "Padel startup error:",
      error
    );
    app.innerHTML = `
      <div class="setup-screen">
        <div style="max-width:420px">
          <div
            style="font-size:32px;margin-bottom:15px"
          >
            ⚠️
          </div>
          <h2
            style="margin:0 0 10px;color:#E8384F"
          >
            Dashboard couldn't load
          </h2>
          <p
            style="color:#7C93B5;font-size:13px;line-height:1.6"
          >
            The dashboard loaded, but it couldn't
            connect to Firebase.
          </p>
          <div
            style="
              margin-top:15px;
              padding:12px;
              background:#16233A;
              border:1px solid rgba(255,255,255,0.08);
              border-radius:8px;
              text-align:left;
              font-family:monospace;
              font-size:11px;
              color:#F19AA6;
              word-break:break-word
            "
          >
            ${escapeHTML(error.message)}
          </div>
          <p
            style="
              margin-top:15px;
              color:#7C93B5;
              font-size:11px
            "
          >
            Open Safari's developer console if you
            need more information.
          </p>
        </div>
      </div>
    `;
  }
}
startApp();
</script>
