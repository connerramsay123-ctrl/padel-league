html, body {

button {

#app {

/* HEADER */

.header {

/* MAIN */

.main {

  max-width: 520px;
  margin: 0 auto;
  padding: 16px;
}

.section {
  margin-bottom: 16px;
}

/* TABS */

.tab-bar {
  position: fixed;
  z-index: 100;
  bottom: 0;
  left: 0;

.tab-inner {

.tab-button.active {

.tab-icon {

}

.card-padding {

}

/* WEEK SELECT / FILTERS */

.filter-card {

}

.filter-grid {

.filter-select {

.table-header-right {

.team-info {

.team-name {

   ============================================================ */

const ROOT = "padel";


/* ============================================================
   FIREBASE FUNCTIONS
   ============================================================ */

async function firebaseGet(path, fallback) {
  try {
    const response = await fetch(FIREBASE_URL + "/" + ROOT + "/" + path + ".json");
    if (!response.ok) throw new Error("Firebase HTTP " + response.status);
    const data = await response.json();
    if (data === null || data === undefined) return fallback;
    return data;
  } catch (error) {
    console.error("Firebase GET error:", error);
    throw error;
  }
}

async function firebaseSet(path, value) {
  try {
    const response = await fetch(FIREBASE_URL + "/" + ROOT + "/" + path + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(value)
    });
    if (!response.ok) throw new Error("Firebase HTTP " + response.status);
    return true;
  } catch (error) {
    console.error("Firebase SET error:", error);
    throw error;
  }
}


/* ============================================================
   UTILITIES
   ============================================================ */

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")

}

  { id: "w6r2c1", week: 6, round: 2, court: 1, time: "8:00 PM", teamA: "tk", teamB: "lg" },
  { id: "w6r2c2", week: 6, round: 2, court: 2, time: "8:00 PM", teamA: "lj", teamB: "er" },
  { id: "w6r2c3", week: 6, round: 2, court: 3, time: "8:00 PM", teamA: "cb", teamB: "ct" },
  { id: "w6r2c4", week: 6, round: 2, court: 4, time: "8:00 PM", teamA: "kg", teamB: "ks" },

  // WEEK 7
  { id: "w7r1c1", week: 7, round: 1, court: 1, time: "7:30 PM", teamA: "ct", teamB: "tk" },
  { id: "w7r1c2", week: 7, round: 1, court: 2, time: "7:30 PM", teamA: "cb", teamB: "kg" },
  { id: "w7r1c3", week: 7, round: 1, court: 3, time: "7:30 PM", teamA: "er", teamB: "ks" },
  { id: "w7r1c4", week: 7, round: 1, court: 4, time: "7:30 PM", teamA: "lj", teamB: "lg" },
  { id: "w7r2c1", week: 7, round: 2, court: 1, time: "8:00 PM", teamA: "kg", teamB: "tk" },
  { id: "w7r2c2", week: 7, round: 2, court: 2, time: "8:00 PM", teamA: "ct", teamB: "ks" },
  { id: "w7r2c3", week: 7, round: 2, court: 3, time: "8:00 PM", teamA: "cb", teamB: "lg" },
  { id: "w7r2c4", week: 7, round: 2, court: 4, time: "8:00 PM", teamA: "er", teamB: "lj" }

];

// Known results for weeks 1-2, seeded into Firebase the first
// time the dashboard loads with no results stored yet.
const SEED_RESULTS = {
  w1r1c1: [4, 6], w1r1c2: [6, 5], w1r1c3: [6, 3], w1r1c4: [6, 1],
  w1r2c1: [6, 4], w1r2c2: [6, 4], w1r2c3: [6, 0], w1r2c4: [6, 1],
  w2r1c1: [5, 6], w2r1c2: [5, 6], w2r1c3: [0, 6], w2r1c4: [2, 6],
  w2r2c1: [6, 2], w2r2c2: [6, 1], w2r2c3: [6, 2], w2r2c4: [3, 6]
};

const TOTAL_WEEKS = 7;
const QUALIFY_SPOTS = 4;


/* ============================================================
   SCORING RULES
   Win = 3pts. Loss where the losing side scored 4 or 5 games
   (i.e. lost 6-4 or 6-5) = 1pt. Any other loss = 0pts.
   ============================================================ */

function pointsForResult(scoreA, scoreB) {
  if (scoreA === scoreB) {
    return { aPts: 0, bPts: 0 };
  }
  const aWins = scoreA > scoreB;
  const loserScore = aWins ? scoreB : scoreA;
  const loserPts = (loserScore === 4 || loserScore === 5) ? 1 : 0;
  return aWins
    ? { aPts: 3, bPts: loserPts }
    : { aPts: loserPts, bPts: 3 };
}


/* ============================================================
   APP STATE
   ============================================================ */

let results = {};   // { fixtureId: [scoreA, scoreB] }
let passcode = null;

let currentTab = "table";
let expandedTeam = null;
let unlocked = false;
let manageWeek = 1;
let scoreInputs = {}; // local edits before saving, keyed by fixtureId -> [scoreA, scoreB]


/* ============================================================
   STANDINGS
   ============================================================ */

function computeStandings() {

  const stats = {};

  TEAMS.forEach(function(team) {
    stats[team.id] = {
      id: team.id,
      name: team.name,
      played: 0, wins: 0, losses: 0,
      gf: 0, ga: 0, points: 0,
      headToHead: {} // opponentId -> { gf, ga }
    };
  });

  SCHEDULE.forEach(function(fixture) {

    const result = results[fixture.id];
    if (!result) return;

    const [scoreA, scoreB] = result;
    const { aPts, bPts } = pointsForResult(scoreA, scoreB);

    const a = stats[fixture.teamA];
    const b = stats[fixture.teamB];
    if (!a || !b) return;

    a.played++; b.played++;
    a.gf += scoreA; a.ga += scoreB;
    b.gf += scoreB; b.ga += scoreA;
    a.points += aPts; b.points += bPts;

    if (scoreA > scoreB) { a.wins++; b.losses++; }
    else if (scoreB > scoreA) { b.wins++; a.losses++; }

    if (!a.headToHead[fixture.teamB]) a.headToHead[fixture.teamB] = { gf: 0, ga: 0 };
    a.headToHead[fixture.teamB].gf += scoreA;
    a.headToHead[fixture.teamB].ga += scoreB;

    if (!b.headToHead[fixture.teamA]) b.headToHead[fixture.teamA] = { gf: 0, ga: 0 };
    b.headToHead[fixture.teamA].gf += scoreB;
    b.headToHead[fixture.teamA].ga += scoreA;

  });

  return Object.values(stats).map(function(team) {
    return { ...team, gd: team.gf - team.ga };
  });

}

function compareTeams(a, b) {
  if (a.points !== b.points) return b.points - a.points;

  const h2h = a.headToHead[b.id];
  if (h2h) {
    const diff = h2h.gf - h2h.ga;
    if (diff !== 0) return -diff;
  }

  if (a.gf !== b.gf) return b.gf - a.gf;
  if (a.ga !== b.ga) return a.ga - b.ga;
  if (a.gd !== b.gd) return b.gd - a.gd;
  return a.name.localeCompare(b.name);
}

function getSortedStandings() {
  return computeStandings().sort(compareTeams);
}


/* ============================================================
   RENDER
   ============================================================ */

function render() {

  const app = document.getElementById("app");
  const standings = getSortedStandings();

  let html = "";
  html += renderHeader(standings);
  html += '<main class="main">';

  if (currentTab === "table") html += renderTable(standings);
  if (currentTab === "fixtures") html += renderFixtures();
  if (currentTab === "manage") {
    html += unlocked ? renderManage() : renderPasscodeGate();
  }

  html += "</main>";
  html += renderTabBar();

  app.innerHTML = html;
  attachEvents();

}


/* ============================================================
   HEADER
   ============================================================ */

function renderHeader(standings) {

  const playedFixtures = SCHEDULE.filter(f => results[f.id]).length;

  return `
    <header class="header">
      <div class="header-kicker">Season 1</div>
      <h1>Thursday Night<br>Padel Club</h1>
      <div class="header-meta">
        <span>${TEAMS.length} teams</span>
        <span>·</span>
        <span>${playedFixtures} / ${SCHEDULE.length} games played</span>
      </div>
    </header>
  `;

}


/* ============================================================
   LEAGUE TABLE
   ============================================================ */

function renderTable(standings) {

  let html = "";

  html += `
    <div class="table-header">
      <span>Team</span>
      <div class="table-header-right">
        <span>Pts</span>
        <span>GD</span>
      </div>
    </div>
  `;

  standings.forEach(function(team, index) {

    const rank = index + 1;
    const isOpen = expandedTeam === team.id;
    const qualifying = rank <= QUALIFY_SPOTS;

    let rankBg = "#1E2E48";
    let rankColor = "#7C93B5";
    if (rank === 1) { rankBg = "#E8B94A"; rankColor = "#0B1420"; }
    if (rank === 2) { rankBg = "#C9C9C9"; rankColor = "#0B1420"; }
    if (rank === 3) { rankBg = "#B08655"; rankColor = "#0B1420"; }

    html += `
      <div class="card team-row ${qualifying ? "qualifying" : ""}">
        <button class="team-main" data-action="expand" data-id="${team.id}">
          <div class="rank" style="background:${rankBg};color:${rankColor}">${rank}</div>
          <div class="team-info">
            <div class="team-name">${escapeHTML(team.name)}</div>
            <div class="team-record">P${team.played} · W${team.wins} L${team.losses}</div>
          </div>
          <div class="points">${team.points}</div>
          <div class="gd-value">${formatGD(team.gd)}</div>
          <div class="chevron ${isOpen ? "open" : ""}">▾</div>
        </button>
        ${isOpen ? `
          <div class="team-stats">
            ${statCell("P", team.played)}
            ${statCell("W", team.wins)}
            ${statCell("L", team.losses)}
            ${statCell("GF", team.gf)}
            ${statCell("GA", team.ga)}
            ${statCell("GD", formatGD(team.gd))}
          </div>
        ` : ""}
      </div>
    `;

  });

  html += `
    <div class="legend-row">
      <span class="legend-dot"></span>
      <span>Top ${QUALIFY_SPOTS} qualify for the semi-finals</span>
    </div>
    <div class="table-note">
      Win = 3pts · 6-4 or 6-5 loss = 1pt · other loss = 0pts<br>
      Tiebreakers: points → head-to-head → games for → games against → game difference
    </div>
  `;

  return html;

}

function statCell(label, value) {
  return `
    <div class="stat-cell">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${value}</div>
    </div>
  `;
}


/* ============================================================
   FIXTURES & RESULTS (read only)
   ============================================================ */

function renderFixtures() {

  let html = "";

  for (let week = 1; week <= TOTAL_WEEKS; week++) {

    html += `
      <div class="week-heading">
        <span class="week-title">Week ${week}</span>
        <span class="week-pill">2 rounds · 4 courts</span>
      </div>
    `;

    [1, 2].forEach(function(round) {

      const roundFixtures = SCHEDULE.filter(f => f.week === week && f.round === round);
      if (!roundFixtures.length) return;

      html += `<div class="round-label">Round ${round} · ${roundFixtures[0].time}</div>`;

      roundFixtures.forEach(function(fixture) {

        const result = results[fixture.id];
        const aName = teamName(fixture.teamA);
        const bName = teamName(fixture.teamB);

        let scoreHTML = '<span class="fixture-score pending">–</span>';
        let aClass = "fixture-team";
        let bClass = "fixture-team right";

        if (result) {
          const [scoreA, scoreB] = result;
          scoreHTML = `<span class="fixture-score">${scoreA}–${scoreB}</span>`;
          if (scoreA > scoreB) aClass += " winner";
          if (scoreB > scoreA) bClass += " winner";
        }

        html += `
          <div class="card fixture-row">
            <span class="fixture-court">C${fixture.court}</span>
            <span class="${aClass}">${escapeHTML(aName)}</span>
            ${scoreHTML}
            <span class="${bClass}">${escapeHTML(bName)}</span>
          </div>
        `;

      });

    });

  }

  return html;

}


/* ============================================================
   PASSCODE GATE
   ============================================================ */

function renderPasscodeGate() {

  const setup = !passcode;

  return `
    <div class="gate">
      <div class="gate-icon">${setup ? "🔑" : "🔒"}</div>
      <h2>${setup ? "Set a manager passcode" : "Manager access"}</h2>
      <p>${setup
        ? "Anyone with this passcode can enter and edit match results."
        : "Enter the passcode to enter or edit results."}</p>
      <div class="gate-form">
        <input id="passcode-input" type="password" class="input" placeholder="Passcode">
        ${setup ? `<input id="passcode-confirm" type="password" class="input" placeholder="Confirm passcode">` : ""}
        <div id="passcode-error" style="color:#F19AA6;font-size:12px;margin-bottom:8px"></div>
        <button class="primary-button" data-action="unlock">
          ${setup ? "Set passcode & unlock" : "Unlock"}
        </button>
      </div>
    </div>
  `;

}


/* ============================================================
   MANAGE — ENTER / EDIT RESULTS
   ============================================================ */

function renderManage() {

  let html = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <div style="flex:1">
        <div class="filter-label">Week</div>
        <select id="manage-week" class="filter-select">
          ${weekOptions()}
        </select>
      </div>
      <button class="lock-button" data-action="lock">🔒</button>
    </div>
  `;

  [1, 2].forEach(function(round) {

    const roundFixtures = SCHEDULE.filter(f => f.week === manageWeek && f.round === round);
    if (!roundFixtures.length) return;

    html += `<div class="round-label">Round ${round} · ${roundFixtures[0].time}</div>`;

    roundFixtures.forEach(function(fixture) {

      const existing = results[fixture.id];
      const edited = scoreInputs[fixture.id];
      const scoreA = edited ? edited[0] : (existing ? existing[0] : "");
      const scoreB = edited ? edited[1] : (existing ? existing[1] : "");

      html += `
        <div class="card manage-fixture">
          <div class="manage-fixture-top">
            <span>Court ${fixture.court}</span>
          </div>
          <div class="manage-score-row">
            <span class="manage-team-name">${escapeHTML(teamName(fixture.teamA))}</span>
            <input class="manage-score-input" type="number" min="0" inputmode="numeric"
              data-action="score-input" data-fixture="${fixture.id}" data-side="a" value="${scoreA}">
            <span class="manage-vs">–</span>
            <input class="manage-score-input" type="number" min="0" inputmode="numeric"
              data-action="score-input" data-fixture="${fixture.id}" data-side="b" value="${scoreB}">
            <span class="manage-team-name" style="text-align:right">${escapeHTML(teamName(fixture.teamB))}</span>
          </div>
        </div>
      `;

    });

  });

  html += `
    <div id="manage-error" style="color:#F19AA6;font-size:12px;margin-top:4px"></div>
    <button class="primary-button" data-action="save-week" style="margin-top:12px">
      Save Week ${manageWeek} results
    </button>
  `;

  return html;

}

function weekOptions() {
  let options = "";
  for (let week = 1; week <= TOTAL_WEEKS; week++) {
    options += `<option value="${week}" ${manageWeek === week ? "selected" : ""}>Week ${week}</option>`;
  }
  return options;
}


/* ============================================================
   TAB BAR
   ============================================================ */

function renderTabBar() {
  return `
    <nav class="tab-bar">
      <div class="tab-inner">
        ${tabButton("table", "🏆", "Table")}
        ${tabButton("fixtures", "📅", "Fixtures")}
        ${tabButton("manage", "🎾", "Manage")}
      </div>
    </nav>
  `;
}

function tabButton(id, icon, label) {
  return `
    <button class="tab-button ${currentTab === id ? "active" : ""}" data-action="tab" data-tab="${id}">
      <span class="tab-icon">${icon}</span>
      ${label}
    </button>
  `;
}


/* ============================================================
   EVENTS
   ============================================================ */

function attachEvents() {

  document.querySelectorAll('[data-action="tab"]').forEach(function(button) {
    button.addEventListener("click", function() {
      currentTab = button.dataset.tab;
      render();
    });
  });

  document.querySelectorAll('[data-action="expand"]').forEach(function(button) {
    button.addEventListener("click", function() {
      expandedTeam = expandedTeam === button.dataset.id ? null : button.dataset.id;
      render();
    });
  });

  const unlock = document.querySelector('[data-action="unlock"]');
  if (unlock) unlock.addEventListener("click", handleUnlock);

  const lock = document.querySelector('[data-action="lock"]');
  if (lock) {
    lock.addEventListener("click", function() {
      unlocked = false;
      render();
    });
  }

  const manageWeekSelect = document.getElementById("manage-week");
  if (manageWeekSelect) {
    manageWeekSelect.addEventListener("change", function() {
      manageWeek = Number(manageWeekSelect.value);
      scoreInputs = {};
      render();
    });
  }

  document.querySelectorAll('[data-action="score-input"]').forEach(function(input) {
    input.addEventListener("input", function() {
      const fixtureId = input.dataset.fixture;
      const side = input.dataset.side;
      if (!scoreInputs[fixtureId]) {
        const existing = results[fixtureId] || ["", ""];
        scoreInputs[fixtureId] = [existing[0], existing[1]];
      }
      scoreInputs[fixtureId][side === "a" ? 0 : 1] = input.value;
    });
  });

  const saveWeek = document.querySelector('[data-action="save-week"]');
  if (saveWeek) saveWeek.addEventListener("click", saveWeekResults);

}


/* ============================================================
   PASSCODE HANDLING
   ============================================================ */

async function handleUnlock() {

  const input = document.getElementById("passcode-input");
  const error = document.getElementById("passcode-error");
  const value = input ? input.value : "";

  if (!passcode) {

    const confirmInput = document.getElementById("passcode-confirm");

    if (!value || value.length < 4) {
      error.textContent = "Use at least 4 characters.";
      return;
    }

    if (!confirmInput || value !== confirmInput.value) {
      error.textContent = "Passcodes don't match.";
      return;
    }

    try {
      await firebaseSet("passcode", value);
      passcode = value;
      unlocked = true;
      render();
    } catch (e) {
      error.textContent = "Couldn't save passcode: " + e.message;
    }

    return;

  }

  if (value === passcode) {
    unlocked = true;
    render();
  } else {
    error.textContent = "Wrong passcode.";
  }

}


/* ============================================================
   SAVE RESULTS
   ============================================================ */

async function saveWeekResults() {

  const error = document.getElementById("manage-error");
  const weekFixtures = SCHEDULE.filter(f => f.week === manageWeek);

  const updated = { ...results };

  for (const fixture of weekFixtures) {

    const edited = scoreInputs[fixture.id];
    const existing = results[fixture.id];

    const scoreA = edited ? edited[0] : (existing ? existing[0] : "");
    const scoreB = edited ? edited[1] : (existing ? existing[1] : "");

    if (scoreA === "" && scoreB === "") continue;

    if (scoreA === "" || scoreB === "") {
      error.textContent = "Enter both scores for Court " + fixture.court + ", or leave both blank.";
      return;
    }

    updated[fixture.id] = [Number(scoreA), Number(scoreB)];

  }

  try {
    await firebaseSet("results", updated);
    results = updated;
    scoreInputs = {};
    alert("Week " + manageWeek + " results saved!");
    render();
  } catch (e) {
    error.textContent = "Couldn't save results: " + e.message;
  }

}


/* ============================================================
   START APP
   ============================================================ */

async function startApp() {

  const app = document.getElementById("app");

  try {

    console.log("Padel: starting application");

    if (!FIREBASE_URL || FIREBASE_URL.includes("PASTE")) {
      throw new Error("Firebase URL is not configured.");
    }

    const [storedResults, storedPasscode] = await Promise.all([
      firebaseGet("results", null),
      firebaseGet("passcode", null)
    ]);

    if (storedResults === null) {
      // First ever load — seed the known week 1-2 results.
      results = { ...SEED_RESULTS };
      await firebaseSet("results", results);
    } else {
      results = storedResults;
    }

    passcode = storedPasscode || null;

    console.log("Padel: Firebase loaded", {
      resultsCount: Object.keys(results).length,
      hasPasscode: !!passcode
    });

    render();

  } catch (error) {

    console.error("Padel startup error:", error);

    app.innerHTML = `
      <div class="setup-screen">
        <div style="max-width:420px">
          <div style="font-size:32px;margin-bottom:15px">⚠️</div>
          <h2 style="margin:0 0 10px;color:#E8384F">Dashboard couldn't load</h2>
          <p style="color:#7C93B5;font-size:13px;line-height:1.6">
            The dashboard loaded, but it couldn't connect to Firebase.
          </p>
          <div style="margin-top:15px;padding:12px;background:#16233A;border:1px solid rgba(255,255,255,0.08);border-radius:8px;text-align:left;font-family:monospace;font-size:11px;color:#F19AA6;word-break:break-word">
            ${escapeHTML(error.message)}
          </div>
          <p style="margin-top:15px;color:#7C93B5;font-size:11px">
            Open Safari's developer console if you need more information.
          </p>
        </div>
      </div>
    `;

  }

}

startApp();

</script>
